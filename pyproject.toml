[project]
name = "modeling-generation"
version = "0.1.0"
description = "Generative modeling experiments: VAE, EBM, Diffusion, Segmentation"
requires-python = ">=3.12"
dependencies = [
    "torch==2.10.*",
    "torchvision",
    "pytorch-lightning",
    "lightning",
    "numpy",
    "matplotlib",
    "scikit-image",
    "Pillow",
    "opencv-python",
    "tqdm",
    "scipy",
    "pandas",
    "ipykernel",
    "jupyterlab",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
